[build]
  command = "cd client && npm install --include=dev && npm run build && cd ../server && npm install"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
