[build]
  command = "cd client && npm install --include=dev && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["serverless-http", "express", "mongoose", "bcryptjs", "jsonwebtoken", "cors", "dotenv"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
